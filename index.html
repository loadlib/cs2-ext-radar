<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Radar</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { align-items: center; justify-content: center; padding: 20px; }
    main { width: min(320px, 100%); }
    h1 { margin: 0 0 16px; font-size: 15px; font-weight: 600; letter-spacing: .06em; }
    form { display: flex; gap: 6px; }
    input { flex: 1; text-transform: uppercase; letter-spacing: .16em; font-family: var(--font-mono); }
  </style>
</head>
<body>
  <main>
    <h1>CS2 RADAR</h1>
    <form id="connect">
      <input id="room" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Session code">
      <button type="submit">OPEN</button>
    </form>
  </main>
  <script>
    document.getElementById("connect").addEventListener("submit", (event) => {
      event.preventDefault();
      const room = document.getElementById("room").value.trim().toUpperCase();
      if (room.length >= 4) location.href = `radar.html?room=${encodeURIComponent(room)}`;
    });
    const input = document.getElementById("room");
    input.addEventListener("input", () => {
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    });
  </script>
</body>
</html>
