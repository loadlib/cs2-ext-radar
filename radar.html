<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Radar</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/radar.css">
</head>
<body>
  <header class="bar">
    <div class="mark">CS2 RADAR</div>
    <form class="connect" id="connect">
      <input id="room" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Session code">
      <button type="submit">CONNECT</button>
    </form>
    <div class="state" id="state">OFFLINE</div>
    <button class="icon panel-toggle" id="toggle-ct" title="Counter-Terrorists" aria-label="Toggle CT panel">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button class="icon panel-toggle" id="toggle-t" title="Terrorists" aria-label="Toggle T panel">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button class="icon" id="fullscreen" title="Map only" aria-label="Toggle map-only view">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </header>

  <div class="matchbar">
    <div class="mb"><span>map</span><b id="map-name">—</b></div>
    <div class="mb timer"><b id="clock">—</b></div>
    <div class="mb"><span>phase</span><b id="phase">—</b></div>
    <div class="mb"><span>alive</span><b id="alive">—</b></div>
    <div class="mb"><span>bomb</span><b id="bomb">—</b></div>
    <div class="mb"><span>rate</span><b id="rate">—</b></div>
  </div>

  <div class="shell">
    <aside class="panel team-panel ct" id="ct-panel">
      <div class="panel-head"><span class="team-name"><i class="dot"></i>CT</span><span class="mono" id="ct-count">0</span></div>
      <div id="ct-body"></div>
    </aside>

    <main class="stage">
      <canvas id="map" aria-label="Live radar"></canvas>
      <div class="empty" id="empty">
        <div class="empty-box">
          <div class="empty-title">CS2 RADAR</div>
          <form id="empty-form">
            <input id="room2" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Session code">
            <button type="submit">OPEN</button>
          </form>
        </div>
      </div>
    </main>

    <aside class="panel team-panel t" id="t-panel">
      <div class="panel-head"><span class="team-name"><i class="dot"></i>T</span><span class="mono" id="t-count">0</span></div>
      <div id="t-body"></div>
    </aside>
  </div>

  <script src="js/mqtt.min.js"></script>
  <script type="module" src="js/radar.js"></script>
</body>
</html>
